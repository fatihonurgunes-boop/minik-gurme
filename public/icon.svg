<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8f0"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="bowl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="food" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- App Background (Rounded squircle for standalone icon) -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Baby Bowl -->
  <g filter="url(#shadow)">
    <!-- Bowl Base -->
    <ellipse cx="256" cy="380" rx="90" ry="16" fill="#b45309" opacity="0.25"/>
    <path d="M120 230 C120 360, 392 360, 392 230 Z" fill="url(#bowl)"/>
    <!-- Bowl Inner Rim -->
    <ellipse cx="256" cy="230" rx="136" ry="32" fill="#fef3c7"/>
    <!-- Puree Food Inside Bowl -->
    <ellipse cx="256" cy="235" rx="118" ry="24" fill="url(#food)"/>
    <ellipse cx="230" cy="232" rx="36" ry="10" fill="#34d399" opacity="0.6"/>
  </g>
  
  <!-- Baby Spoon -->
  <g transform="rotate(35 340 180)" filter="url(#shadow)">
    <!-- Spoon Handle -->
    <rect x="330" y="70" width="22" height="170" rx="11" fill="#fb923c"/>
    <!-- Spoon Head -->
    <ellipse cx="341" cy="245" rx="34" ry="46" fill="#f97316"/>
    <ellipse cx="341" cy="245" rx="26" ry="36" fill="#ffedd5"/>
  </g>

  <!-- Happy Baby Smile on Bowl -->
  <path d="M226 285 Q256 315 286 285" stroke="#78350f" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Rosy Cheeks -->
  <circle cx="210" cy="275" r="10" fill="#f43f5e" opacity="0.35"/>
  <circle cx="302" cy="275" r="10" fill="#f43f5e" opacity="0.35"/>
  <!-- Happy Eyes -->
  <path d="M216 260 Q226 250 236 260" stroke="#78350f" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M276 260 Q286 250 296 260" stroke="#78350f" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- Little Heart Sparkle -->
  <path d="M370 120 C370 105, 350 100, 345 115 C340 100, 320 105, 320 120 C320 140, 345 155, 345 155 C345 155, 370 140, 370 120 Z" fill="#f43f5e"/>
</svg>
